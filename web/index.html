<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc">
  <title>Service status</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a id="brand" class="brand" href="#" aria-label="Status home">
        <span id="brand-mark" class="brand-mark" aria-hidden="true">✳</span>
        <img id="brand-logo" class="brand-logo-image" alt="" hidden>
        <span id="brand-name">Status</span>
      </a>
      <div class="theme-control">
        <button id="theme-trigger" class="theme-trigger" type="button" popovertarget="theme-popover" aria-label="Appearance: System" aria-haspopup="dialog" aria-expanded="false">
          <svg class="theme-icon" data-mode-icon="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2m7.07-17.07-1.42 1.42M6.35 17.65l-1.42 1.42M22 12h-2M4 12H2m17.07 7.07-1.42-1.42M6.35 6.35 4.93 4.93"/></svg>
          <svg class="theme-icon" data-mode-icon="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          <svg class="theme-icon" data-mode-icon="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
          <span class="sr-only">Appearance settings</span>
        </button>
        <div id="theme-popover" class="theme-popover" popover="auto" role="dialog" aria-label="Choose color theme">
          <p class="theme-popover-title">Appearance</p>
          <div class="theme-options" role="group" aria-label="Color theme">
            <button class="theme-option" type="button" data-theme-choice="light" aria-pressed="false">
              <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2m7.07-17.07-1.42 1.42M6.35 17.65l-1.42 1.42M22 12h-2M4 12H2m17.07 7.07-1.42-1.42M6.35 6.35 4.93 4.93"/></svg>
              <span>Light</span>
            </button>
            <button class="theme-option" type="button" data-theme-choice="system" aria-pressed="true">
              <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
              <span>System</span>
            </button>
            <button class="theme-option" type="button" data-theme-choice="dark" aria-pressed="false">
              <svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
              <span>Dark</span>
            </button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">LIVE STATUS PAGE</p>
        <h1 id="page-title">Service status</h1>
        <p id="description" class="muted">Current health and recent history.</p>
      </section>
      <section id="overview" class="overview loading" role="status" aria-live="polite">Loading status…</section>
      <div class="section-heading"><div><p class="eyebrow">INFRASTRUCTURE</p><h2>Services</h2></div><span id="last-checked" class="muted"></span></div>
      <div id="services"></div>
      <section class="incidents-section" aria-labelledby="incidents-title">
        <div class="section-heading"><div><p class="eyebrow">UPDATES</p><h2 id="incidents-title">Incidents</h2></div></div>
        <div id="incidents" class="incidents"></div>
      </section>
    </main>
    <footer><span id="footer-name">Status</span><span>Powered by GitHub Actions · Updated automatically</span></footer>
  </div>
</body>
</html>
