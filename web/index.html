<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9fc">
  <title>Service status</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a id="brand" class="brand" href="#" aria-label="Status home">
        <span id="brand-mark" class="brand-mark" aria-hidden="true">✳</span>
        <img id="brand-logo" class="brand-logo-image" alt="" hidden>
        <span id="brand-name">Status</span>
      </a>
      <div class="theme-switcher" role="group" aria-label="Color theme">
        <button class="theme-button" type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button class="theme-button" type="button" data-theme-choice="system" aria-pressed="true">System</button>
        <button class="theme-button" type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
    </header>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">LIVE STATUS PAGE</p>
        <h1 id="page-title">Service status</h1>
        <p id="description" class="muted">Current health and recent history.</p>
      </section>
      <section id="overview" class="overview loading" role="status" aria-live="polite">Loading status…</section>
      <div class="section-heading"><div><p class="eyebrow">INFRASTRUCTURE</p><h2>Services</h2></div><span id="last-checked" class="muted"></span></div>
      <div id="services"></div>
      <section class="incidents-section" aria-labelledby="incidents-title">
        <div class="section-heading"><div><p class="eyebrow">UPDATES</p><h2 id="incidents-title">Incidents</h2></div></div>
        <div id="incidents" class="incidents"></div>
      </section>
    </main>
    <footer><span id="footer-name">Status</span><span>Powered by GitHub Actions · Updated automatically</span></footer>
  </div>
</body>
</html>
